    <text x="38" y="58" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="32" font-weight="600">Agent Run</text>
    <text x="38" y="92" fill="#8e9188" font-family="'Inter', sans-serif" font-size="18">read_invoice → make_payment</text>

    <g transform="translate(38 138)">
      <rect width="188" height="66" rx="20" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <text x="24" y="41" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="18" font-weight="600">18 scenarios</text>
    </g>

    <g transform="translate(38 232)">
      <rect width="188" height="66" rx="20" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <text x="24" y="41" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="18" font-weight="600">5 model runs</text>
    </g>

    <g transform="translate(38 326)">
      <rect width="188" height="74" rx="20" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <rect x="24" y="22" width="62" height="18" rx="9" fill="url(#ecomm-blue)" />
      <rect x="98" y="22" width="52" height="18" rx="9" fill="url(#ecomm-accent)" />
      <text x="24" y="58" fill="#b7b9b2" font-family="'Inter', sans-serif" font-size="14">450 executions</text>
    </g>
  </g>

  <g transform="translate(814 114)">
    <rect width="300" height="414" rx="30" fill="#0f151b" stroke="#2a343d" stroke-width="2" />
    <text x="34" y="54" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="30" font-weight="600">Ledger Grade</text>
    <text x="34" y="86" fill="#8e9188" font-family="'Inter', sans-serif" font-size="18">Utility, safety, refusal, value</text>

    <g transform="translate(34 130)">
      <path d="M0 172 L48 126 L96 128 L144 74 L192 44 L232 22" fill="none" stroke="#8ea270" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M0 210 L48 194 L96 196 L144 154 L192 148 L232 104" fill="none" stroke="#7397a4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M0 246 L48 228 L96 220 L144 206 L192 184 L232 172" fill="none" stroke="#c58a63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.86" />
      <g fill="#f2f3f0" opacity="0.78">
        <circle cx="0" cy="172" r="7" />
        <circle cx="48" cy="126" r="7" />
        <circle cx="96" cy="128" r="7" />
        <circle cx="144" cy="74" r="7" />
        <circle cx="192" cy="44" r="7" />
        <circle cx="232" cy="22" r="7" />
