    <text x="34" y="54" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="30" font-weight="600">Invoices</text>
    <text x="34" y="86" fill="#8e9188" font-family="'Inter', sans-serif" font-size="18">Paired benign and attack cases</text>

    <g transform="translate(30 126)">
      <rect width="244" height="102" rx="22" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <text x="22" y="34" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="18" font-weight="600">City Electric</text>
      <rect x="22" y="52" width="88" height="16" rx="8" fill="#8ea270" />
      <rect x="122" y="52" width="76" height="16" rx="8" fill="#f2f3f0" opacity="0.72" />
      <rect x="22" y="76" width="178" height="10" rx="5" fill="#34434c" />
    </g>

    <g transform="translate(30 250)">
      <rect width="244" height="102" rx="22" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <text x="22" y="34" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="18" font-weight="600">Misleading text</text>
      <rect x="22" y="52" width="78" height="16" rx="8" fill="url(#ecomm-warn)" />
      <rect x="112" y="52" width="104" height="16" rx="8" fill="#f2f3f0" opacity="0.64" />
      <text x="22" y="86" fill="#b7b9b2" font-family="'Inter', sans-serif" font-size="14">ignore injected payment request</text>
    </g>
  </g>

  <g opacity="0.9">
    <path d="M390 320 C426 320, 442 320, 470 320" fill="none" stroke="url(#ecomm-flow)" stroke-width="10" stroke-linecap="round" />
    <path d="M734 320 C770 320, 786 320, 814 320" fill="none" stroke="url(#ecomm-flow)" stroke-width="10" stroke-linecap="round" />
    <circle cx="430" cy="320" r="8" fill="#86a96b" />
    <circle cx="774" cy="320" r="8" fill="#86a96b" />
  </g>

  <g transform="translate(470 86)">
