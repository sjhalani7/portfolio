    </g>

    <g transform="translate(34 342)">
      <rect width="232" height="42" rx="16" fill="#151d23" stroke="#2c3942" stroke-width="2" />
      <text x="22" y="27" fill="#b7b9b2" font-family="'Inter', sans-serif" font-size="15">balanced score • unauthorized value</text>
    </g>
  </g>

  <text x="600" y="642" text-anchor="middle" fill="#f2f3f0" font-family="'Inter', sans-serif" font-size="48" font-weight="600">EComm-Bench</text>
  <text x="600" y="676" text-anchor="middle" fill="#8e9188" font-family="'Inter', sans-serif" font-size="22">Benchmarking payment-capable agents against misleading invoice text</text>
</svg>
