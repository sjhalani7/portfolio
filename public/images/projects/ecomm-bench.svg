<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecomm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1014" />
      <stop offset="55%" stop-color="#121a20" />
      <stop offset="100%" stop-color="#1d252b" />
    </linearGradient>
    <linearGradient id="ecomm-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ea270" />
      <stop offset="100%" stop-color="#607f72" />
    </linearGradient>
    <linearGradient id="ecomm-warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c58a63" />
      <stop offset="100%" stop-color="#b86b6b" />
    </linearGradient>
    <linearGradient id="ecomm-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7397a4" />
      <stop offset="100%" stop-color="#526f86" />
    </linearGradient>
    <linearGradient id="ecomm-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86a96b" stop-opacity="0" />
      <stop offset="48%" stop-color="#86a96b" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#86a96b" stop-opacity="0" />
    </linearGradient>
    <pattern id="ecomm-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(242,243,240,0.045)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="50" fill="url(#ecomm-bg)" />
  <rect x="52" y="52" width="1096" height="616" rx="38" fill="url(#ecomm-grid)" opacity="0.55" />

  <g transform="translate(86 114)">
