<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT mental health sentiment analysis</title>
  <desc id="desc">A stylized research diagram showing social posts filtered into conversation sentiment over a threaded graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
